<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* INTRO */
#intro {
    position: absolute;
    color: white;
    font-size: 2em;
    text-align: center;
    animation: fadeIn 2s ease, fadeOut 2s ease 3s forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}

@keyframes fadeOut {
    to {opacity: 0;}
}

/* MAIN */
#main {
    display: none;
}

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    width: 320px;
    height: 220px;
    text-align: center;
}

h1 {
    color: #ff4d6d;
}

/* BOTONES */
button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
}

#yes {
    background: #28a745;
    color: white;
}

#no {
    background: #dc3545;
    color: white;
    position: absolute;
    left: 180px;
    top: 120px;
    transition: all 0.3s ease;
}

/* pantalla SI */
#loveScreen {
    display: none;
    color: white;
    font-size: 2em;
    text-align: center;
}

/* GALERIA */
#gallery {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

#gallery img {
    width: 45%;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(255,255,255,0.3);
}

/* corazones */
.heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: float 5s linear infinite;
}

@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<div id="intro">
    💘 Te amo M' Negrita Hermsosha 💘
</div>

<div id="main">
    <div class="card" id="card">
        <h1>¿Me amas? 😳💖</h1>
        <button id="yes">Sí 😍</button>
        <button id="no">No 😢</button>
    </div>
</div>

<div id="loveScreen">
    💘 Sabía que sí 😍💘
</div>

<div id="gallery">
    <img src="foto1.jpeg">
    <img src="foto2.jpeg">
    <img src="foto3.jpeg">
    <img src="foto4.jpeg">
</div>

<script>
let yesBtn = document.getElementById("yes");
let noBtn = document.getElementById("no");
let intro = document.getElementById("intro");
let main = document.getElementById("main");
let loveScreen = document.getElementById("loveScreen");
let gallery = document.getElementById("gallery");
let card = document.getElementById("card");

let scale = 1;

/* intro */
setTimeout(() => {
    intro.style.display = "none";
    main.style.display = "block";
}, 5000);

/* frases */
let frases = ["¿seguro? 😢","piénsalo... 🥺","no seas así 😭","dale sí 😡"];
let i = 0;

/* mover NO */
let posX = 150;
let posY = 100;
let velX = 2;
let velY = 2;

function moveNo() {
    noBtn.innerText = frases[i % frases.length];
    i++;

    scale += 0.15;
    yesBtn.style.transform = "scale(" + scale + ")";
}

setInterval(() => {
    const maxX = card.clientWidth - noBtn.offsetWidth;
    const maxY = card.clientHeight - noBtn.offsetHeight;

    posX += velX;
    posY += velY;

    if (posX <= 0 || posX >= maxX) velX *= -1;
    if (posY <= 0 || posY >= maxY) velY *= -1;

    noBtn.style.left = posX + "px";
    noBtn.style.top = posY + "px";
}, 20);

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* CLICK SI */
yesBtn.addEventListener("click", () => {
    main.style.display = "none";
    loveScreen.style.display = "block";

    setTimeout(() => {
        loveScreen.style.display = "none";
        gallery.style.display = "flex";
    }, 3000);
});

/* corazones */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
