<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* INTRO */
#intro {
    position: absolute;
    color: white;
    font-size: 2em;
    text-align: center;
    animation: fadeIn 2s ease, fadeOut 2s ease 2s forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}

@keyframes fadeOut {
    to {opacity: 0;}
}

/* MAIN */
#main { display: none; }

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    width: 320px;
    height: 220px;
    text-align: center;
}

h1 { color: #ff4d6d; }

/* BOTONES */
button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
}

#yes {
    background: #28a745;
    color: white;
    transition: transform 0.2s;
}

#no {
    background: #dc3545;
    color: white;
    position: absolute;
    left: 150px;
    top: 110px;
    transition: all 0.25s ease;
}

/* MENSAJE */
#loveScreen {
    display: none;
    color: white;
    font-size: 2em;
    text-align: center;
}

/* SLIDESHOW */
#slideshow {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translateY(100%);
    transition: transform 1s ease;
}

.slide.active {
    transform: translateY(0);
}

/* corazones */
.heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: float 5s linear infinite;
}

@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<div id="intro">
    💘 Te amo M' Negrita Hermsosha 💘
</div>

<div id="main">
    <div class="card" id="card">
        <h1>¿Me amas? 😳💖</h1>
        <button id="yes">Sí 😍</button>
        <button id="no">No 😢</button>
    </div>
</div>

<div id="loveScreen">
    💘 Sabía que sí 😍💘
</div>

<!-- SLIDES -->
<div id="slideshow">
    <img src="foto1.jpeg" class="slide">
    <img src="foto2.jpeg" class="slide">
    <img src="foto3.jpeg" class="slide">
    <img src="foto4.jpeg" class="slide">
</div>

<script>
let yesBtn = document.getElementById("yes");
let noBtn = document.getElementById("no");
let intro = document.getElementById("intro");
let main = document.getElementById("main");
let loveScreen = document.getElementById("loveScreen");
let slideshow = document.getElementById("slideshow");
let card = document.getElementById("card");

let scale = 1;

/* INTRO */
setTimeout(() => {
    intro.style.display = "none";
    main.style.display = "block";
}, 3000);

/* FRASES */
let frases = ["¿seguro? 😢","piénsalo... 🥺","no seas así 😭","dale sí 😡"];
let i = 0;

/* MOVIMIENTO NO */
let posX = 150, posY = 100, velX = 2, velY = 2;

function moveNo() {
    noBtn.innerText = frases[i % frases.length];
    i++;
    scale += 0.15;
    yesBtn.style.transform = "scale(" + scale + ")";
}

setInterval(() => {
    const maxX = card.clientWidth - noBtn.offsetWidth;
    const maxY = card.clientHeight - noBtn.offsetHeight;

    posX += velX;
    posY += velY;

    if (posX <= 0 || posX >= maxX) velX *= -1;
    if (posY <= 0 || posY >= maxY) velY *= -1;

    noBtn.style.left = posX + "px";
    noBtn.style.top = posY + "px";
}, 20);

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* CLICK SI */
yesBtn.addEventListener("click", () => {
    main.style.display = "none";
    loveScreen.style.display = "block";

    setTimeout(() => {
        loveScreen.style.display = "none";
        startSlideshow();
    }, 2500);
});

/* SLIDESHOW */
function startSlideshow() {
    slideshow.style.display = "block";
    let slides = document.querySelectorAll(".slide");
    let index = 0;

    slides[index].classList.add("active");

    setInterval(() => {
        slides[index].classList.remove("active");
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
    }, 2500);
}

/* CORAZONES */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
