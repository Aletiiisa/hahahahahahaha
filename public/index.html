<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* INTRO */
#intro {
    position: absolute;
    font-size: 2em;
    text-align: center;
    animation: fadeIn 2s ease, fadeOut 2s ease 2s forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}
@keyframes fadeOut { to {opacity: 0;} }

#main { display: none; }

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 320px;
    height: 220px;
    text-align: center;
    position: relative;
    color: black;
}

h1 { color: #ff4d6d; }

button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
}

#yes { background: green; color: white; }
#no {
    background: red;
    color: white;
    position: absolute;
    left: 150px;
    top: 100px;
}

/* LOVE */
#loveScreen { display: none; font-size: 2em; }

/* SLIDES */
#slides {
    display: none;
    text-align: center;
    width: 90%;
}

.slide-img {
    width: 80%;
    max-height: 60vh;
    border-radius: 15px;
    transition: all 1s ease;
}

.small {
    width: 40%;
}

/* TEXTO */
.text {
    margin-top: 20px;
    font-size: 1.2em;
    min-height: 60px;
}

/* botón */
#nextBtn {
    margin-top: 20px;
    background: #ff4d6d;
    color: white;
}

/* 💖 CORAZONES */
.heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
    from {transform: translateY(100vh); opacity:1;}
    to {transform: translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-love.mp3" loop></audio>

<div id="intro">💘 Te amo M' Negrita Hermsosha 💘</div>

<div id="main">
    <div class="card" id="card">
        <h1>¿Me amas? 😳💖</h1>
        <button id="yes">Sí 😍</button>
        <button id="no">No 😢</button>
    </div>
</div>

<div id="loveScreen">💘 Sabía que sí 😍💘</div>

<div id="slides">
    <img id="img" class="slide-img">
    <div id="text" class="text"></div>
    <button id="nextBtn">Siguiente ➡️</button>
</div>

<script>
let intro = document.getElementById("intro");
let main = document.getElementById("main");
let love = document.getElementById("loveScreen");
let slides = document.getElementById("slides");

let yes = document.getElementById("yes");
let no = document.getElementById("no");
let card = document.getElementById("card");

let img = document.getElementById("img");
let text = document.getElementById("text");
let nextBtn = document.getElementById("nextBtn");
let music = document.getElementById("music");

/* intro */
setTimeout(()=>{
    intro.style.display="none";
    main.style.display="block";
},3000);

/* NO se mueve */
no.addEventListener("mouseover",moveNo);
no.addEventListener("touchstart",moveNo);

function moveNo(){
    const maxX=card.clientWidth-no.offsetWidth;
    const maxY=card.clientHeight-no.offsetHeight;
    no.style.left=Math.random()*maxX+"px";
    no.style.top=Math.random()*maxY+"px";
}

/* DATOS */
let fotos = [
{
src:"foto1.jpeg",
text:"Recuerdo que ese día estaba de cumpleaños y ese día entero me hiciste sentir la persona más especial de todo el universo... amé cada detalle que me diste, cada beso, cada palabra que salía de tu boca. Ese día me encantó, me hiciste sentir como el hombre más afortunado ya que te quedaste conmigo durante todo mi cumpleaños 🥺💕"
},
{
src:"foto2.jpg",
text:"Esa fotito fue el 24 de diciembre... recuerdo que te dije que subamos al techo y empezamos a hablar y luego te dije para tomar fotitos como siempre. Ese día estabas súper hermosa y podía ver mi cara en el reflejo de tus ojitos hermosos. Ese día me encantó como no te imaginas, uno de mis días favoritos negrita 💗"
},
{
src:"foto3.jpg",
text:"Esa fotito fue el 14... recuerdo que ese día estaba súper ansioso porque vinieras a mi casa (te extrañaba con toda mi alma negrita 🥹). Pensé 'déjame comprarle sus flores' ya que te las mereces, y mejor aún que estábamos a 14 no te iba a dejar con las manitas vacías. Cuando te las di... tu carita se puso tan hermosa como no te imaginas, nunca te vi tan feliz, te lo juro. Y haberte invitado a mi casa fue la mejor decisión que he tomado, porque gracias a ese día pudimos volver a hablarnos más, mi vida 💜"
}
];

let index=0;

/* TYPEWRITER */
function escribir(texto, i=0){
    text.innerHTML = texto.substring(0,i);
    if(i < texto.length){
        setTimeout(()=>escribir(texto,i+1),30);
    }
}

/* SI */
yes.addEventListener("click",()=>{
    main.style.display="none";
    love.style.display="block";

    music.play().catch(()=>{}); // 🔥 música

    setTimeout(()=>{
        love.style.display="none";
        slides.style.display="block";
        showSlide();
        corazones();
    },2500);
});

/* MOSTRAR */
function showSlide(){
    if(index>=fotos.length){
        nextBtn.innerText="Final 💘";
        return;
    }

    img.classList.remove("small");
    img.src=fotos[index].src;

    text.innerHTML="";
    escribir(fotos[index].text);
}

/* SIGUIENTE */
nextBtn.addEventListener("click",()=>{
    img.classList.add("small");

    setTimeout(()=>{
        index++;
        showSlide();
    },1000);
});

/* 💖 CORAZONES */
function corazones(){
    setInterval(()=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerText="💖";
        heart.style.left=Math.random()*100+"vw";
        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),4000);
    },500);
}
</script>

</body>
</html>
