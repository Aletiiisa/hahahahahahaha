<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: black;
    overflow: hidden;
    font-family: Arial;
    color: white;
}

/* SLIDES */
#slides {
    display: block;
    position: absolute;
    width: 100%;
    height: 100%;
}

/* IMAGEN FULL */
#img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: all 1s ease;
    z-index: 1;
}

/* MODO MINI EXTREMO 🔥 */
.small {
    width: 120px;
    height: 120px;
    top: 20px;
    left: 20px;
    transform: none;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
}

/* TEXTO GIGANTE */
#text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2em;
    text-align: center;
    opacity: 0;
    transition: opacity 1s ease;
    padding: 20px;
    max-width: 80%;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
}

/* mostrar texto */
.show { opacity: 1; }

/* botón */
#nextBtn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff4d6d;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    z-index: 20;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="slides">
    <img id="img">
    <div id="text"></div>
    <button id="nextBtn">Siguiente ➡️</button>
</div>

<script>
let img = document.getElementById("img");
let text = document.getElementById("text");
let nextBtn = document.getElementById("nextBtn");

let fotos = [
{
src:"foto1.jpeg",
text:"Ese 24 de diciembre... uno de mis días favoritos contigo 💗"
},
{
src:"foto2.jpeg",
text:"Mi cumpleaños contigo fue perfecto 🥺💕"
},
{
src:"foto3.jpeg",
text:"Ese 14... estabas hermosa con esas flores 💜"
},
{
src:"foto4.jpeg",
text:"Simplemente nosotros 💘"
}
];

let index = 0;
let fase = 0; // 0 = mostrar imagen, 1 = mostrar texto

function showSlide(){
    if(index >= fotos.length){
        text.innerText = "💘 FIN 💘";
        text.classList.add("show");
        img.style.display = "none";
        nextBtn.style.display = "none";
        return;
    }

    img.classList.remove("small");
    text.classList.remove("show");

    img.src = fotos[index].src;
    text.innerText = fotos[index].text;

    fase = 0;
}

nextBtn.addEventListener("click",()=>{

    if(fase === 0){
        // ENCÓGER A MINI 🔥
        img.classList.add("small");

        setTimeout(()=>{
            text.classList.add("show");
        },500);

        fase = 1;

    } else {
        // SIGUIENTE
        index++;
        showSlide();
    }

});

showSlide();
</script>

</body>
</html>
