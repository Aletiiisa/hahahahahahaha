<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 💘</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* INTRO */
#intro {
    position: absolute;
    font-size: 2em;
    text-align: center;
    animation: fadeIn 2s ease, fadeOut 2s ease 2s forwards;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}

@keyframes fadeOut {
    to {opacity: 0;}
}

#main { display: none; }

/* CARD */
.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    width: 320px;
    height: 220px;
    text-align: center;
    position: relative;
    color: black;
}

h1 { color: #ff4d6d; }

button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
}

#yes { background: green; color: white; }
#no {
    background: red;
    color: white;
    position: absolute;
    left: 150px;
    top: 100px;
}

/* LOVE */
#loveScreen { display: none; font-size: 2em; }

/* SLIDES */
#slides {
    display: none;
    text-align: center;
    width: 90%;
}

.slide-img {
    width: 80%;
    max-height: 60vh;
    border-radius: 15px;
    transition: all 1s ease;
}

.small {
    width: 40%;
}

.text {
    margin-top: 20px;
    font-size: 1.1em;
    opacity: 0;
    transition: opacity 1s ease;
}

.show { opacity: 1; }

/* botón siguiente */
#nextBtn {
    margin-top: 20px;
    background: #ff4d6d;
    color: white;
}
</style>
</head>

<body>

<div id="intro">💘 Te amo M' Negrita Hermsosha 💘</div>

<div id="main">
    <div class="card" id="card">
        <h1>¿Me amas? 😳💖</h1>
        <button id="yes">Sí 😍</button>
        <button id="no">No 😢</button>
    </div>
</div>

<div id="loveScreen">💘 Sabía que sí 😍💘</div>

<div id="slides">
    <img id="img" class="slide-img">
    <div id="text" class="text"></div>
    <button id="nextBtn">Siguiente ➡️</button>
</div>

<script>
let intro = document.getElementById("intro");
let main = document.getElementById("main");
let love = document.getElementById("loveScreen");
let slides = document.getElementById("slides");

let yes = document.getElementById("yes");
let no = document.getElementById("no");
let card = document.getElementById("card");

let img = document.getElementById("img");
let text = document.getElementById("text");
let nextBtn = document.getElementById("nextBtn");

/* intro */
setTimeout(()=>{
    intro.style.display="none";
    main.style.display="block";
},3000);

/* NO se mueve */
no.addEventListener("mouseover",()=>moveNo());
no.addEventListener("touchstart",()=>moveNo());

function moveNo(){
    const maxX=card.clientWidth-no.offsetWidth;
    const maxY=card.clientHeight-no.offsetHeight;
    no.style.left=Math.random()*maxX+"px";
    no.style.top=Math.random()*maxY+"px";
}

/* DATOS */
let fotos = [
{
src:"foto1.jpeg",
text:"Esa fotito fue el 24 de diciembre... uno de mis días favoritos contigo negrita 💗"
},
{
src:"foto2.jpeg",
text:"Ese día de mi cumpleaños me hiciste sentir el hombre más afortunado 🥺💕"
},
{
src:"foto3.jpeg",
text:"Ese 14... tu carita con las flores fue lo más hermoso que vi 💜"
},
{
src:"foto4.jpeg",
text:"Y esta última... simplemente nosotros 💘"
}
];

let index=0;

/* SI */
yes.addEventListener("click",()=>{
    main.style.display="none";
    love.style.display="block";

    setTimeout(()=>{
        love.style.display="none";
        slides.style.display="block";
        showSlide();
    },2500);
});

/* MOSTRAR */
function showSlide(){
    if(index>=fotos.length){
        nextBtn.innerText="Final 💘";
        return;
    }

    img.classList.remove("small");
    text.classList.remove("show");

    img.src=fotos[index].src;
    text.innerText=fotos[index].text;
}

/* SIGUIENTE */
nextBtn.addEventListener("click",()=>{
    img.classList.add("small");
    text.classList.add("show");

    setTimeout(()=>{
        index++;
        showSlide();
    },1200);
});
</script>

</body>
</html>
